set timeout_style=hidden
set timeout=1
set default=0
insmod all_video
set gfxmode=1280x800x32,1280x800,1024x768x32,1024x768,auto
set gfxpayload=keep
terminal_output gfxterm
menuentry "ArkOS 0.13.0+mouse1 - Aurora" {
    multiboot2 /boot/kernel.elf
    boot
}
menuentry "ArkOS — 1920 × 1080" {
    multiboot2 /boot/kernel.elf
    set gfxpayload=1920x1080x32
    boot
}
menuentry "ArkOS — 2560 × 1440" {
    multiboot2 /boot/kernel.elf
    set gfxpayload=2560x1440x32
    boot
}
menuentry "ArkOS — 3840 × 2160（需要 1 GiB 内存）" {
    multiboot2 /boot/kernel.elf
    set gfxpayload=3840x2160x32
    boot
}
